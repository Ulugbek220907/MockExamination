<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="theme-color" content="#e9e8e2" />
  <!-- Google Search Console ownership check for https://www.testday.uz/ (keep it: removing it un-verifies the site). -->
  <meta name="google-site-verification" content="Prm-tWClyByMpQqNwmQhTiq2pMa4gYLGruGIfOelJ1I" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TestDay" />
  <meta property="og:title" content="TestDay – IELTS practice like test day" />
  <meta property="og:description" content="Timed Listening, Reading, Writing and Speaking tests on a screen like test day. Five free full tests in every module." />
  <meta property="og:url" content="%SITE_URL%/" />
  <meta property="og:locale" content="en_GB" />
  <meta property="og:image" content="%SITE_URL%/img/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="TestDay: IELTS practice like test day." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="%SITE_URL%/img/og.png" />
  <link rel="canonical" href="%SITE_URL%/" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="fonts/schibsted-grotesk-core.woff2?v=1" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/portal.css" />
  <!-- The data the home page needs is requested now, while the scripts download, instead of after they have run. -->
  <link rel="preload" href="/api/tests" as="fetch" crossorigin />
  <link rel="preload" href="/api/config" as="fetch" crossorigin />
  <link rel="preload" href="/api/me" as="fetch" crossorigin />
  <script type="application/json" id="asset-versions">{}</script>
  <!-- For search engines: the site and its owner. -->
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"TestDay","url":"%SITE_URL%/","inLanguage":"en","description":"Computer-delivered IELTS practice: Listening, Academic Reading, Writing and Speaking tests. Free tests in every module."}</script>
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"TestDay","url":"%SITE_URL%/","logo":"%SITE_URL%/img/logo-512.png"}</script>
  <script src="js/strings.js" defer></script>
  <script src="js/util.js" defer></script>
  <script src="js/vendor/lenis.min.js" defer></script>
  <script src="js/smooth.js" defer></script>
  <script src="js/scoring.js" defer></script>
  <script src="js/account.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body class="theme-default text-regular">

  <!-- =====================================================================
       SITE SHELL: home, prices, examiners, account, results, static pages
       ===================================================================== -->
  <div id="site-view" class="view-container active">
    <header class="site-nav">
      <a class="site-brand" href="#/" aria-label="TestDay home"><span data-site-name>TestDay</span></a>
      <nav class="site-links" aria-label="Main">
        <a href="#/pricing" data-nav="pricing" data-commerce hidden>Price</a>
        <a href="#/about" data-nav="about">About</a>
      </nav>
      <div class="site-tools">
        <div class="account-slot" id="account-slot"></div>
      </div>
    </header>

    <main id="site-main" class="site-main" tabindex="-1" aria-busy="true">
      <!-- The page's shape before the tests arrive: no text, and the same height as the real page. -->
      <div class="boot" aria-hidden="true">
        <div class="boot-hero"><i class="skeleton"></i><i class="skeleton"></i><span class="boot-lead skeleton"></span></div>
        <div class="boot-ledger">
          <div class="boot-row"><b class="skeleton"></b><u class="skeleton"></u></div>
          <div class="boot-row"><b class="skeleton"></b><u class="skeleton"></u></div>
          <div class="boot-row"><b class="skeleton"></b><u class="skeleton"></u></div>
          <div class="boot-row"><b class="skeleton"></b><u class="skeleton"></u></div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <div class="footer-top">
          <div class="col-a footer-links" id="footer-contact"></div>
          <div class="col-b">
            <div class="footer-links" id="footer-social"></div>
            <nav class="footer-nav" aria-label="More">
              <a href="#/pricing" data-commerce hidden>Price</a>
              <a href="#/about">About</a>
              <a href="#/examiners" data-commerce hidden>Examiners</a>
              <a href="#/terms">Terms</a>
              <a href="#/privacy">Privacy</a>
              <a href="#/refunds" data-commerce hidden>Refunds</a>
              <button type="button" id="feedback-open">Feedback</button>
            </nav>
            <p class="footer-small">TestDay is independent and not affiliated with the IELTS partners. <span class="sys">©</span> <span id="footer-year">2026</span></p>
          </div>
        </div>
        <div class="footer-word" aria-hidden="true" data-site-name>TestDay</div>
      </div>
    </footer>
  </div>

  <!-- =====================================================================
       PRE-TEST INSTRUCTIONS
       ===================================================================== -->
  <div id="verification-view" class="view-container">
    <div class="verification-card" id="verification-card"></div>
  </div>

  <!-- =====================================================================
       COMPUTER-DELIVERED EXAM ENVIRONMENT (reading, listening, writing and speaking)
       ===================================================================== -->
  <div id="exam-screen" class="view-container">
    <header class="cd-header">
      <div class="cd-header-left">
        <div class="cd-candidate-info"><span>Candidate: <strong id="exam-candidate-name">Candidate</strong></span></div>
        <span class="cd-test-badge" id="exam-test-title">Reading</span>
      </div>
      <div class="cd-header-center">
        <button type="button" class="cd-timer-box" id="exam-timer-box" title="Hide or show the timer">
          <span id="exam-timer-text">60:00</span>
        </button>
      </div>
      <div class="cd-header-right">
        <button type="button" class="cd-icon-btn" id="btn-contrast" title="Change colour contrast">Contrast</button>
        <button type="button" class="cd-icon-btn" id="btn-text-size" title="Change text size">Text size</button>
        <button type="button" class="cd-icon-btn" id="btn-hide" title="Hide the test screen for a break">Hide</button>
        <button type="button" class="cd-icon-btn" id="btn-help" title="Help and keyboard shortcuts">Help</button>
      </div>
    </header>

    <div class="cd-audio-bar" id="exam-audio-bar" hidden></div>

    <div class="pane-switch" role="tablist" aria-label="Switch view">
      <button type="button" class="pane-switch-btn active" data-pane="left" role="tab" aria-selected="true" id="pane-switch-left">Passage</button>
      <button type="button" class="pane-switch-btn" data-pane="right" role="tab" aria-selected="false" id="pane-switch-right">Questions</button>
    </div>

    <div class="cd-workspace" id="exam-workspace">
      <div class="cd-pane-left" id="exam-pane-left" tabindex="0"></div>
      <div class="cd-resizer" id="exam-resizer" title="Drag to resize" role="separator" aria-orientation="vertical"></div>
      <div class="cd-pane-right" id="exam-pane-right"></div>
    </div>

    <footer class="cd-footer">
      <div class="cd-footer-left"><div class="part-nav-tabs" id="exam-part-tabs"></div></div>
      <div class="cd-footer-center" id="exam-question-strip" aria-label="Questions"></div>
      <div class="cd-footer-right">
        <label class="cd-review-checkbox-label" id="exam-review-wrap">
          <input type="checkbox" id="exam-review-check" />
          <span>Review</span>
        </label>
        <button type="button" class="cd-arrow-btn" id="btn-prev-q" title="Previous (Alt+P)" aria-label="Previous">&lt;</button>
        <button type="button" class="cd-arrow-btn" id="btn-next-q" title="Next (Alt+N)" aria-label="Next">&gt;</button>
        <button type="button" class="cd-submit-btn" id="btn-submit-exam">Finish test</button>
      </div>
    </footer>
  </div>

</body>
</html>
