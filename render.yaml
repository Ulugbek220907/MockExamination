services:
  - type: web
    name: mock-exam-platform
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SITE_NAME
        value: MockExam
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: AI_PER_IP_PER_HOUR
        value: "6"
      - key: AI_DAILY_LIMIT
        value: "300"
      - key: ADMIN_TOKEN
        generateValue: true
      # Secrets: Render asks for these when you create the Blueprint.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_APP_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: SITE_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: PLAN_PRICE
        value: "39000"
      - key: WRITING_CHECK_PRICE
        value: "10000"
      - key: SPEAKING_CHECK_PRICE
        value: "20000"
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_KEY
        sync: false
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false
      - key: PAYMENT_CARD_NUMBER
        sync: false
      - key: PAYMENT_CARD_HOLDER
        sync: false
      # Optional notifications (see DEPLOY.md 4.6).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
