services:
  - type: web
    name: testday
    runtime: python
    # Frankfurt is much closer to Central Asia than Oregon. The region is fixed
    # when a service is created; changing it here does not move an existing one.
    region: frankfurt
    plan: free
    branch: main
    autoDeploy: true
    # The social poster (social-poster/) is a separate service: changes there do not redeploy the website.
    buildFilter:
      ignoredPaths:
        - social-poster/**
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SITE_NAME
        value: TestDay
      # Launch setting: five free tests per module, the rest "Coming soon…", no prices, pass, refunds or
      # examiner checks. Set to 1 when the site starts selling.
      - key: COMMERCE_ENABLED
        value: "0"
      # The AI examiner (Writing marking and Speaking with the AI examiner), through OpenRouter.
      - key: AI_MODEL
        value: google/gemini-3.8-flash
      - key: AI_PER_IP_PER_HOUR
        value: "6"
      - key: AI_DAILY_LIMIT
        value: "300"
      - key: ADMIN_TOKEN
        generateValue: true
      # Secrets: Render asks for these when you create the Blueprint.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_APP_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      # Footer social links (full https:// addresses); an empty one is hidden.
      - key: SOCIAL_TELEGRAM
        sync: false
      - key: SOCIAL_INSTAGRAM
        sync: false
      - key: SOCIAL_YOUTUBE
        sync: false
      - key: SOCIAL_TIKTOK
        sync: false
      - key: SITE_URL
        sync: false
      # Copy it from the old service if it has one, so people stay signed in after the move.
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: PLAN_PRICE
        value: "39000"
      - key: WRITING_CHECK_PRICE
        value: "10000"
      - key: SPEAKING_CHECK_PRICE
        value: "20000"
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_KEY
        sync: false
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false
      - key: PAYMENT_CARD_NUMBER
        sync: false
      - key: PAYMENT_CARD_HOLDER
        sync: false
      # Optional notifications (see DEPLOY.md 4.6).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false

  # ---------------------------------------------------------------------------------------------------
  # The social poster: a separate small service that posts one TestDay post a day to YouTube, TikTok,
  # Instagram, Threads and Facebook (see social-poster/README.md). It is its own service with its own
  # deploys, disk and settings; the website does not use it. It has to stay awake to post on time and keeps
  # its records on a disk, so it needs a paid instance (Starter). Every platform key below is optional.
  # ---------------------------------------------------------------------------------------------------
  - type: web
    name: testday-social
    runtime: python
    rootDir: social-poster
    region: frankfurt
    plan: starter
    branch: main
    autoDeploy: true
    # Redeploy only when this folder changes (the website's changes do not touch the poster).
    buildFilter:
      paths:
        - social-poster/**
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /healthz
    disk:
      name: social-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_DIR
        value: /var/data
      - key: TIMEZONE
        value: Asia/Tashkent
      - key: POST_TIME
        value: "10:00"
      - key: SITE_URL
        value: https://www.testday.uz
      # Leave off until you have tried "Dry run" on every platform on the admin page.
      - key: POSTING_ENABLED
        value: "0"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_TOKEN
        generateValue: true
      # The apps you register with each platform (see README.md). Leave any you do not use empty.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: THREADS_APP_ID
        sync: false
      - key: THREADS_APP_SECRET
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
